---
read_registers:
  name: Read Registers
  description: >
    Read one or more registers, for debugging purposes
  fields:
    inverter:
      name: Inverter
      description: Which inverter to target. Pass a device ID or unique friendly name.
      required: true
      default: "''"
      example: "''"
      selector:
        device:
          integration: foxess_modbus
    start_address:
      name: Start Address
      description: Start address to write to
      required: true
      example: 31000
      default: 31000
      selector:
        number:
          mode: box
    count:
      name: Count
      description: Number of registers to read
      required: true
      example: 1
      default: 1
      selector:
        number:
          mode: box
    type:
      name: Type
      description: Type of register to read
      required: true
      default: input
      selector:
        select:
          options:
            - input
            - holding
write_registers:
  name: Write Registers
  description: >
    Writes one or more registers
  fields:
    inverter:
      name: Inverter
      description: Which inverter to target. Pass a device ID or unique friendly name.
      required: true
      default: "''"
      example: "''"
      selector:
        device:
          integration: foxess_modbus
    start_address:
      name: Start Address
      description: Start address to write to
      required: true
      example: 41001
      default: 1
      selector:
        number:
          mode: box
    values:
      name: Values
      description: Comma seperated list of values to write
      required: true
      example: "1, 2, 3"
      default: "1, 2, 3"
      selector:
        text:
update_charge_period:
  name: Update Charge Period
  description: >
    Updates one of the two charge periods (if supported by your inverter, see https://github.com/nathanmarlor/foxess_modbus/wiki/Supported-Features)
  fields:
    inverter:
      name: Inverter
      description: Which inverter to target. Pass a device ID or unique friendly name. If your inverter isn't listed here, it probably isn't supported.
      required: true
      default: "''"
      example: "''"
      selector:
        device:
          integration: foxess_modbus
          entity:
            # Only charge periods provide binary_sensors with class power, for charge period on/off
            domain: "binary_sensor"
            device_class: "power"
    charge_period:
      name: Charge Period
      description: Which charge period to update.
      required: true
      example: "'1'"
      selector:
        select:
          options:
            - label: Time period 1
              value: "1"
            - label: Time period 2
              value: "2"
    enable_force_charge:
      name: Enable force charge
      description: Whether to enable this force charge window.
      required: true
      example: true
      selector:
        boolean:
    enable_charge_from_grid:
      name: Enable charge from grid
      description: >
        If set, the battery will charge from PV and the grid during this force charge window, until it reaches Max SoC.
        If unset, the battery will charge from PV but not the grid during this force charge window, and won't discharge.
      required: true
      example: false
      selector:
        boolean:
    start:
      name: Period Start
      description: >
        The start of the charge period. This is only required if 'Enable force charge' is selected.
      required: true
      default: "02:00:00"
      example: "02:00:00"
      selector:
        time:
    end:
      name: Period End
      description: >
        The end of the charge period. This is only required of 'Enable force charge' is selected.

        This may not be less than or equal to 'Start' (time periods may not span midnight).
      required: true
      default: "05:00:00"
      example: "05:00:00"
      selector:
        time:
update_all_charge_periods:
  name: Update All Charge Periods
  description: Sets all charge periods in one service call (if supported by your inverter, see https://github.com/nathanmarlor/foxess_modbus/wiki/Supported-Features). The service "Update Charge Period" is easier for end-users to use.
  fields:
    inverter:
      name: Inverter
      description: Which inverter to target. Pass a device ID or unique friendly name. If your inverter isn't listed here, it probably isn't supported.
      required: true
      default: "''"
      example: "''"
      selector:
        device:
          integration: foxess_modbus
          entity:
            # Only charge periods provide binary_sensors with class power, for charge period on/off
            domain: "binary_sensor"
            device_class: "power"
    charge_periods:
      name: Charge Periods
      description: Charge periods to set. This should be an array of objects, one for each charge period. All charge periods must be specified. See the example data
      required: true
      default: ""
      example: >
        - enable_force_charge: true
          enable_charge_from_grid: true
          start: "01:00"
          end: "03:00"
        - enable_force_charge: false
          enable_charge_from_grid: false
      selector:
        object:
get_evo_schedule:
  name: Get EVO Schedule
  description: Reads the EVO Mode Scheduler (register 48000 and slots 1-8). See docs/evo/mode-scheduler.md.
  fields:
    inverter:
      name: Inverter
      description: Which inverter to target. Pass a device ID or unique friendly name.
      required: true
      default: "''"
      example: "''"
      selector:
        device:
          integration: foxess_modbus
set_evo_schedule:
  name: Set EVO Schedule
  description: >
    Replaces the EVO Mode Scheduler. Slots are written in order (earlier slots win where they overlap), followed
    by an all-day "remaining" slot, exactly as the Fox app does. Each slot is written as one complete block and
    read back to confirm. Editing the schedule in the Fox app afterwards will overwrite it.
  fields:
    inverter:
      name: Inverter
      description: Which inverter to target. Pass a device ID or unique friendly name.
      required: true
      default: "''"
      example: "''"
      selector:
        device:
          integration: foxess_modbus
    enabled:
      name: Enable scheduler
      description: Turn the Mode Scheduler on (register 48000). If off, the slots are stored but the inverter follows its Work Mode.
      required: false
      default: true
      selector:
        boolean:
    slots:
      name: Slots
      description: >
        Up to 7 slots. work_mode is one of self_use, feed_in, back_up, force_charge, force_discharge. min_soc/max_soc
        apply to self_use, feed_in and back_up; fd_soc (cut-off SoC) and fd_pwr (watts) apply to force_charge and
        force_discharge.
      required: false
      example: >
        - start: "01:00"
          end: "04:30"
          work_mode: force_charge
          fd_soc: 95
          fd_pwr: 6000
        - start: "16:00"
          end: "19:00"
          work_mode: feed_in
          min_soc: 20
          max_soc: 100
      selector:
        object:
    remaining:
      name: Remaining time slots
      description: Work mode and SoC limits for times not covered by a slot (work_mode is self_use, feed_in or back_up).
      required: false
      example: >
        work_mode: self_use
        min_soc: 10
        max_soc: 100
      selector:
        object:
set_evo_schedule_enabled:
  name: Set EVO Scheduler Enabled
  description: Turns the EVO Mode Scheduler (register 48000) on or off without changing the slots.
  fields:
    inverter:
      name: Inverter
      description: Which inverter to target. Pass a device ID or unique friendly name.
      required: true
      default: "''"
      example: "''"
      selector:
        device:
          integration: foxess_modbus
    enabled:
      name: Enabled
      description: Turn the Mode Scheduler on or off.
      required: true
      selector:
        boolean:
